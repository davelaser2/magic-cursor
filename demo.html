<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Magic Cursor Demo</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #121212;
			color: #f5f5f5;
			font-family: system-ui, sans-serif;
		}

		.content {
			max-width: 650px;
			text-align: center;
			line-height: 1.6;
		}

		a {
			color: #7be1ff;
		}
	</style>
</head>
<body>
	<div class="content">
		<h1>Magic Cursor Demo</h1>
		<p>Move your mouse around to see the cursor trail and point effect.</p>
		<p>Open this file in a browser and the effect will start automatically.</p>
		<p><strong>Note:</strong> the demo disables itself on smaller screens.</p>
	</div>

	<script src="src/magicCursor.js"></script>
	<script>
		if (window.MagicCursor && typeof MagicCursor.init === 'function') {
			MagicCursor.init();
		}
	</script>
</body>
</html>
